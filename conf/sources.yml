# Registro declarativo de fontes. Validado por src/betscerveja/registry.py.
# Campos obrigatórios: id, titulo, publicador, dominio, tipo, adapter, licenca,
# e_oficial, tier_confiabilidade.
# PDFs no lake exigem vintage_publicacao e landing_filename.
#
# tier_confiabilidade:
#   A = dado oficial primário
#   B = pesquisa / think tank / preprint sem conflito material
#   C = jornalismo, indústria, amostra de fornecedor ou conflito de interesse
#
# status_acervo:
#   no_lake        = arquivo já está em data/00_landing
#   pendente       = precisamos coletar (pergunta externa)
#   planejada      = entra na Fase 1 via API, ainda sem bytes
#   fora_de_escopo = deliberadamente fora do projeto

sources:
