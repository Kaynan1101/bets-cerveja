# Catálogo de métricas canônicas. Vira seed_metricas / dim_metrica no dbt (etapa 5).
# Não misturar fluxo bruto, GGR e destinações legais.

metrics:
  - id: producao_cerveja_litros
    unidade: litro
    periodicidade: anual
    descricao: Volume declarado de produção de cerveja (MAPA).
    distingue_de: []

  - id: producao_bebidas_alcoolicas_indice
    unidade: indice
    periodicidade: mensal
    descricao: PIM-PF SIDRA 8885, categoria 11.1 (129192). Inclui zero das cervejarias.
    distingue_de: [producao_cerveja_litros]

  - id: producao_industrial_geral_indice
    unidade: indice
    periodicidade: mensal
    descricao: PIM-PF SIDRA 8888, indústria geral (Brasil).
    distingue_de: [producao_bebidas_alcoolicas_indice]

  - id: ipca_cerveja
    unidade: indice
    periodicidade: mensal
    descricao: Item cerveja no IPCA (SIDRA 7060).

  - id: rendimento_real
    unidade: brl_constante
    periodicidade: mensal
    descricao: Rendimento médio real. Código SGS a confirmar.

  - id: fluxo_bruto_apostado
    unidade: brl
    periodicidade: mensal
    descricao: Valor enviado a casas de apostas (Pix). Ordem de R$ 20 bi/mês no EE119.
    distingue_de: [ggr, destinacoes_legais]

  - id: ggr
    unidade: brl
    periodicidade: mensal
    descricao: Gross Gaming Revenue. Sem fonte no lake; métrica reservada, não materializar.
    distingue_de: [fluxo_bruto_apostado, destinacoes_legais]

  - id: destinacoes_legais
    unidade: brl
    periodicidade: mensal
    descricao: 12% do GGR destinados por lei. Não é o tamanho do mercado.
    distingue_de: [fluxo_bruto_apostado, ggr]

  - id: apostadores
    unidade: pessoas
    periodicidade: irregular
    descricao: "Contagem de apostadores. No lake: amostra Klavi, não censo."

  - id: participacao_orcamento_apostas
    unidade: percentual
    periodicidade: irregular
    descricao: Participação das apostas no orçamento familiar, por classe.

  - id: substituicao_categoria_despesa
    unidade: percentual
    periodicidade: irregular
    descricao: Percentual de apostadores que dizem ter tirado o dinheiro de uma categoria.

  - id: empregos_setor_apostas
    unidade: pessoas
    periodicidade: irregular
    descricao: Emprego no setor de apostas. IEPS (formais/RAIS) e IBJR/ANJL (diretos e indiretos) não são a mesma definição.

  - id: empregos_setor_cerveja
    unidade: pessoas
    periodicidade: anual
    descricao: Empregos diretos na fabricação de cervejas e chopes (CNAE 1113-5/02, CAGED via Anuário MAPA).

  - id: exportacao_cerveja
    unidade: kg_ou_litro
    periodicidade: anual
    descricao: Exportação de cerveja no Anuário MAPA. kg até ref 2021–22; litros a partir do Anuário pub 2024 (inclui sem álcool).

  - id: cerveja_sem_alcool_litros
    unidade: litro
    periodicidade: anual
    descricao: Volume de cerveja sem álcool. MAPA é produção declarada; Euromonitor (via jornalismo) é venda. Não emendar.
