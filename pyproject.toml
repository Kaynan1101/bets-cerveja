[project]
name = "betscerveja"
version = "0.1.0"
description = "Pipeline de dados sobre apostas e o mercado de cerveja no Brasil (2023-2026)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kaynan" }]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pandera>=0.22",
    "pdfplumber>=0.11",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tenacity>=9.0",
    "trafilatura>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "dbt-core>=1.9,<1.11",
    "dbt-duckdb>=1.9,<1.11",
    "dvc[s3]>=3.59",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
betscerveja = "betscerveja.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betscerveja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/seed_landing.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
