version: 2

seeds:
  - name: seed_metricas
    description: Catálogo canônico a partir de conf/metrics.yml.
    columns:
      - name: metrica_id
        data_tests:
          - unique
          - not_null
  - name: seed_fontes
    description: Catálogo de fontes a partir de conf/sources.yml. vintage 0 = série sem vintage (API).
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [source_id, vintage_publicacao]
  - name: seed_citacoes
    description: >
      Indicadores esparsos citáveis (PDF/HTML) e fallback da produção MAPA
      se o parse do extract falhar. Não é atalho para SIDRA/BCB.
    columns:
      - name: source_id
        data_tests:
          - not_null
      - name: metrica_id
        data_tests:
          - not_null
      - name: valor
        data_tests:
          - not_null
  - name: seed_qa_divergencias
    description: >
      Pares de QA citáveis que não saem dos fatos (kg vs L, zero MAPA vs Euromonitor,
      apostadores Klavi vs LAI, EE119 vs Regulus). Produção 2024 e emprego IEPS/IBJR
      vêm de SQL em qa_divergencias.
    config:
      column_types:
        metrica_id: varchar
        ano_referencia: integer
        data_inicio: date
        source_id_a: varchar
        vintage_a: integer
        valor_a: double
        unidade_a: varchar
        source_id_b: varchar
        vintage_b: integer
        valor_b: double
        unidade_b: varchar
        tipo_divergencia: varchar
        nota: varchar
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns:
              [metrica_id, ano_referencia, source_id_a, vintage_a, source_id_b, vintage_b]
    columns:
      - name: metrica_id
        data_tests:
          - not_null
      - name: tipo_divergencia
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [vintage, unidade, definicao, amostra_vs_universo, fluxo_vs_receita]
